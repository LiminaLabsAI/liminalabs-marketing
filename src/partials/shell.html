<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://liminalabs.in{{path}}">

<script>try{var t=localStorage.getItem("limina-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>

<meta name="theme-color" content="#F5F6FC">
<link rel="icon" href="{{base}}assets/favicon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{base}}assets/favicon/favicon.ico" sizes="any">
<link rel="icon" href="{{base}}assets/favicon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="{{base}}assets/app-icon/icon-180-light.png">
<link rel="manifest" href="{{base}}assets/manifest.webmanifest">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Limina Labs">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="https://liminalabs.in{{path}}">
<meta property="og:image" content="https://liminalabs.in/assets/social/og-image-1200x630-light.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="https://liminalabs.in/assets/social/og-image-1200x630-light.png">

<link rel="stylesheet" href="{{base}}design-system/css/limina.css?v=2.1">
<link rel="stylesheet" href="{{base}}src/site.css?v=2.1">
</head>

<body>
<a class="lim-skip" href="#main">Skip to content</a>

<svg class="lim-ambient lim-mark" viewBox="16 30 146 132" aria-hidden="true" focusable="false">
  <path class="lb-bar" d="M38 30L162 30L140 54L16 54Z"></path>
  <path class="lb-bar" d="M38 66L134 66L112 90L16 90Z"></path>
  <path class="lb-bar" d="M38 102L106 102L84 126L16 126Z"></path>
  <path class="lb-bar" d="M38 138L78 138L56 162L16 162Z"></path>
</svg>

{{nav}}

<main id="main" class="lim-below-nav">
{{content}}
</main>

{{footer}}

<script src="{{base}}design-system/js/limina.js?v=2.1" defer></script>
<script src="{{base}}src/site.js?v=2.1" defer></script>
</body>
</html>
